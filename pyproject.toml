[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercer"
version = "0.1.0"
description = "Natural Language to SQL for real-world databases"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

# Pinned conservatively to avoid CI churn from minor releases. Bump when
# upstream releases a feature we want; CI re-runs on every change so
# regressions surface before they hit master.
[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
dev = [
    "mercer[test]",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/baselanaya/mercer"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "eval/*",
    "scripts/*",
    "data/*",
    "docker/*",
    ".venv/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "inference", "schema", "db", "kernels", "prompts", "config", "app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["data/", "docker/", "eval/", "scripts/"]

[[tool.mypy.overrides]]
module = ["tests.*", "tests"]
disallow_untyped_defs = false
disallow_untyped_decorators = false
disable_error_code = ["method-assign", "arg-type", "misc", "call-arg", "no-untyped-def", "var-annotated"]

[tool.setuptools.packages.find]
exclude = ["tests*", "data*", "eval*", "docs*"]
